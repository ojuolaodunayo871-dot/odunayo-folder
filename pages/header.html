<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federal Poly Ede, Osun State</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        .container{
            background-color: olive;
            color: blueviolet;
            padding: 20px;
            font-weight: bold;
        }
        .register{
            background-color: chocolate;
            padding: 20px;
            margin: 40px;
            border: 1 solid blue;
            border-radius: 5px;
            box-shadow: 5px 5px 6px 2px black;
        }
        h2{
            color: blue;
            text-align: center;
        }
        .login{
            background-color: whitesmoke;
            max-width: 350px;
            padding: 60px;
            margin-left: 290px;
            border-radius: 6px;
            border: 2px solid blue;
        }
        label{
            color: brown;
            font-family: 'Times New Roman', Times, serif;
            margin: 5px;
        }
        input{
            width: 100%;
            line-height: 1.5;
            margin-top: 4px;
            padding: 5px;
        }
        #btn-Register{
            background-color: olive;
            color: chocolate;
            border: none;
            border-radius: 5px;
            box-shadow: 1px 1px 1px blue;
            cursor: pointer;
        }
        #btn-Register :hover{
            background-color: yellow;
            color: blue;
        }
        #btn-Reset{
            background-color: olive;
            color: blue;
            border: none;
            border-radius: 5px;
            box-shadow: 1px 1px 1px 0px black;
            cursor: pointer;
        }
        #btn-Reset :hover{
            background-color: blue;
            color:yellow;
        }
    </style>
</head>
<body>
    <div class="container">
        Federal Polytechnic Ede, <br> Osun State
    </div>
    <div class="register">
        <h2>Student Registration</h2>
    <div class="login">
        <label for="Fullnsme">Fullnsme</label>
        <input type="text" placeholder="enter Fullnsme">
        <label for="Othername">Othername</label>
        <input type="text" placeholder="enter Othername">
        <label for="Phone number"> Phone number</label>
        <input type="text" placeholder="enter Phone number">
        <label for="Email"> Email</label>
        <input type="text" placeholder="enter Email">
        <input type="button" value="Register" id="btn-Register">
        <input type="button" value="Reset" id="btn-Reset">

    </div>
    </div>
    
</body>
</html>
