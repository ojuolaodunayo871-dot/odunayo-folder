<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colspan</title>
</head>
<body>
    <table border="1" width="90%" height="140px" align="center">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td rowspan="2">2</td>
            <td colspan="2">3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td colspan="2">1</td>
            <td>3</td>
            <td>5</td>
        </tr>
        <tr>
            <td rowspan="2">2</td>
            <td>3</td>
            <td colspan="2">4</td>
            <td>5</td>
        </tr>
        <tr>
            <td>1</td>
            <td>3</td>
            <td colspan="2">4</td>
        </tr>
        <tr>
            <td rowspan="3">1</td>
            <td>2</td>
            <td colspan="2">4</td>
            <td>5</td>
        </tr>
        <tr>
             <td>1</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>

                
            <td>1</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr> 
        <tr>
            <td>2</td>
            <td>3</td>
            <td colspan="2">4</td>
            <td>5</td>
        </tr>
       
       
    </table>
    
</body>
</html>
