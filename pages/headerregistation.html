<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        .container{
            background-color: black;
            color: white;
            padding: 20px;
            font-weight: bold;
        }
        .register{
            background-color: white;
            padding: 30px;
            margin: 60px;
            border: 1 solid blue;
            border-radius: 5px;
            box-shadow: 5px 5px 6px 2px;
        }
        h2{
            color: red;
            text-align: center;
        }
        .login{
            background-color: white;
            max-width: 30%;
            padding: 90px;
            margin-left: 290px;
            border-radius: 6px;
            border: 2px solid green;
        }
        label{
            color: blue;
            font-family: 'Times New Roman', Times, serif;
            margin-bottom: 5px;
        }
        input{
            width: 90%;
            line-height: 1.5;
            margin-top: 4px;
            padding: 2px;
        }
        #btn-register{
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 1px 1px 1px red;
            cursor: pointer;
        }
        button{
            width: 100%;
            padding: 3px;
            font-size: larger;
            font-weight: 200;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            cursor: pointer;
            background-color: blue;
            color: white;
            border-radius: 5px;
            
        }
    </style>
</head>
<body>
    <div class="container">
        FEDERAL POLYTECHNIC EDE, <br> OSUN STATE
    </div>
    <div class="register">
        <h2>Student registration</h2>
    <div class="login">
    <table>
        
    <tr>
        <td>Fullname</td>
        <td>Username</td>
    </tr>
    <tr>
        <td><input type="text" placeholder="Enter your name"></td>
        <td><input type="text" placeholder="Enter your username"></td>
    </tr>
    <tr>
        <td>Email</td>
        <td>Phone number</td>
    </tr>
    <tr>
        <td><input type="text" placeholder="Enter your email"></td>
        <td><input type="text" placeholder="Enter your number"></td>
    </tr>
    <tr>
        <td>Password</td>
        <td>Comfirm Password</td>
    </tr>
    <tr>
        <td><input type="text" placeholder="Enter your paasword"></td>
        <td><input type="text" placeholder="Comfirm your Password "></td>
    </tr>
    <tr>
        <td>Gender</td>
    </tr>
    <tr>
        <td>
            <select name="" id="">
                <option value="select">select</option>
                <option value="male">male</option>
                <option value="female">female</option>
                <option value="prefer not to say">prefer not to say</option>
            </select>
        </td>
    </tr>
    <tr>
        <td colspan="2"><button>Register</button></td>
    </tr>
    </div>
    </div>
    </table>
</body>
</html>
