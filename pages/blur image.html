<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blur image</title>
    <style>
        .hero{
            background: linear-gradient(to right, rgba(15, 23, 42, 0.78), rgba(42, 90, 202, 0.48)),
            url(../assets/boy\ with\ system.avif) center/cover no-repeat;
            color: #f8fafc;
            min-height: calc(100vh-42px);
            display: flex;
            align-items: center;
            position: relative;
        }
        .hero::before{
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(48, 103, 86, 0.18 ),transparent 89%); 
        }
        .hero .container{
            position: relative;
            z-index: 1;
            margin: auto;
        }
        button{
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background-color: gray;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: large;
            font-weight: 500;
            margin-right: 10px;
            transition: 1s ease-in;
            cursor: pointer;
        }
        button:hover{
            width: 105%;
            padding: 11px;
            background-color: rgb(151, 218, 218);
            color: brown;
            font-size: larger;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <button>Welcome</button>
            <button>Login</button>
        </div>
    </div>
    
</body>
</html>
