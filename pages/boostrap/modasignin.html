<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>sign in</title>
</head>
<body>
<div class="container" style="width: 35%; margin-top: 60px;">
    <div class="card">
        <i class="bi bi-qr-code-scan p-2 bg-success" style=" text-align: center; width: 10%; text-align: center;"></i>   
        <h3 style="text-align: center;">Sign in</h3>
        <p style="text-align: center;">Access your attendance dashboard</p>
    
    <div class="card-body">
        <div class="row row">
            <div class="col">
                <label for="Email">Email</label>
                <input type="Email" class="form-control">
            </div>
        </div>
        <div class="row row">
            <div class="col">
                <label for="Password">Password</label>
                <input type="Password" class="form-control">
            </div>
        </div>
        <button style="width: 100%; background-color: green; color: white;">Login</button>
        </div>
    </div>
</div>
    
</body>
</html>
