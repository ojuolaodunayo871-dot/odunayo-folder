<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" inte grity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div class="container" style="width: 50%;">
        <div class="card">
            <div class="card-header">
                <h3 style="text-align: center;">Student Registration</h3>
                <p style="text-align: center;">Create your account to mark attendance with QR codes</p>
            <div class="card-body">
                <div class="row row-2">
                    <div class="col mb-3">
                        <label for="username">Firstname</label>
                        <input type="text" class="form-control" id="firstname" placeholder="Enter your firstname">
                    </div>
                    <div class="col mb-3">
                        <label for="lastname">Lastname</label>
                        <input type="text" class="form-control" id="lastname" placeholder="Enter your lastname">
                    </div>
                </div>
                <div class="row row-2">
                    <div class="col mb-3">
                        <label for="matric number">Matric Number</label>
                        <input type="text" class="form-control" id="Password" placeholder="Enter your password">
                    </div>
                    <div class="col mb-3">
                        <label for="email">Email</label>
                        <input type="text" class="form-control" id="comfirm password" placeholder="Enter correct password">
                    </div>
                </div>
                <div class="row row-2">
                    <div class="col mb-3">
                        <label for="phone">Phone </label>
                        <input type="text" class="form-control" id="Gender" placeholder="Enter your gender">
                    </div>
                    <div class="col mb-3">
                        <label for="department">Department</label>
                        <input type="text" class="form-control" id="Marital status">
                    </div>
                    <div class="row row-3">
                        <div class="col">
                            <label for="Gender">Gender</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col">
                            <label for="Level">Level</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col">
                            <label for="Password">Password</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="row">
                            <div class="col mb-3">
                                <label for="Comfirm pasword"> Comfirm Password</label>
                                <input type="text" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <button class="btn btn-success w-100 mb-2">Register</button>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div> 
</body>
</html>
